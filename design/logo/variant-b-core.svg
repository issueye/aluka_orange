<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    aluka_orange · 方案 B 「橙核」
    ─────────────────────────────────────────────
    扁平化 A 单字标：去掉辉光与多面渐变，暖黑 squircle 底 + 单色谱橙。
    横杠右端断口 = 终端光标（caret），表达「AI Agent / 终端」的产品属性。
    16px 托盘尺寸下仍可辨识，是实用性最强的应用图标方向。
  -->
  <defs>
    <linearGradient id="b-glyph" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFB35C"/>
      <stop offset="55%" stop-color="#FF7A1A"/>
      <stop offset="100%" stop-color="#F2530E"/>
    </linearGradient>
  </defs>

  <!-- 暖黑 squircle 底 -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="#1F1410"/>
  <!-- 内侧发丝描边，克制的一点点「被制作过」 -->
  <rect x="40" y="40" width="432" height="432" rx="104" fill="none" stroke="#FFA452" stroke-opacity="0.16" stroke-width="2"/>

  <g fill="url(#b-glyph)">
    <!-- 左腿 -->
    <polygon points="214,136 256,136 208,416 128,416"/>
    <!-- 右腿 -->
    <polygon points="256,136 298,136 384,416 304,416"/>
    <!-- 横杠（左段，斜边贴合腿部内沿） -->
    <polygon points="225.1,316 258,316 258,356 218.3,356"/>
    <!-- 终端光标块（与横杠之间留 12px 断口） -->
    <polygon points="270,316 286.9,316 293.7,356 270,356"/>
  </g>
</svg>
